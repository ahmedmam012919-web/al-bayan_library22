<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cloud Art | لوحة التحكم وإدخال البيانات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ===== الإعدادات العامة ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --bg-color: #f4f6f8;
            --text-color: #333;
            --card-bg: #ffffff;
            --white: #ffffff;
            --border-color: #eee;
            --success-color: #25d366;
            --input-bg: #ffffff;
            --upload-border: #3498db;
            --upload-bg: #f0f8ff;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        body.dark-theme {
            --bg-color: #131c24;
            --text-color: #f5f6fa;
            --card-bg: #1e2b35;
            --primary-color: #1a252f;
            --white: #1e2b35;
            --border-color: #2c3e50;
            --input-bg: #243340;
            --upload-border: #5b9bd5;
            --upload-bg: #1a2a3a;
        }

        /* ===== شاشة البداية ===== */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            opacity: 1;
            visibility: visible;
        }
        .splash-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }
        .splash-content {
            text-align: center;
            color: white;
        }
        .splash-logo {
            font-size: 80px;
            color: var(--secondary-color);
            animation: pulseGlow 1.5s infinite alternate;
        }
        .splash-title {
            font-size: 36px;
            font-weight: 900;
            margin-top: 20px;
        }
        .splash-loader {
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            margin: 25px auto 0;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
        }
        .splash-loader::after {
            content: '';
            position: absolute;
            left: -50%;
            top: 0;
            height: 100%;
            width: 50%;
            background: var(--secondary-color);
            animation: loadingBar 1.5s infinite ease-in-out;
        }

        /* ===== الهيدر ===== */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            position: sticky;
            top: 0;
            z-index: 1000;
            transition: background-color 0.3s;
        }

        .logo {
            font-size: 24px;
            font-weight: 900;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .lang-toggle {
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .lang-toggle:hover {
            background: var(--secondary-color);
            border-color: var(--secondary-color);
            transform: scale(1.05);
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.5);
        }

        .theme-toggle {
            font-size: 22px;
            cursor: pointer;
            color: white;
            transition: transform 0.2s, color 0.2s;
        }
        .theme-toggle:hover {
            transform: scale(1.1);
            color: var(--secondary-color);
        }

        .logout-btn {
            background: transparent;
            color: #ff4757;
            border: 1px solid #ff4757;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            display: none;
        }
        .logout-btn:hover {
            background: #ff4757;
            color: white;
        }

        /* ===== تسجيل الدخول ===== */
        .login-container {
            max-width: 450px;
            margin: 60px auto;
            padding: 40px 30px;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: all 0.3s;
        }
        .login-container h2 {
            margin-bottom: 25px;
            font-weight: 900;
            color: var(--primary-color);
        }
        body.dark-theme .login-container h2 {
            color: #fff;
        }
        .login-container .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        html[dir="ltr"] .login-container .input-group {
            text-align: left;
        }
        .login-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }
        .login-container select,
        .login-container input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 16px;
            transition: border-color 0.3s;
        }
        .login-container select:focus,
        .login-container input:focus {
            border-color: var(--secondary-color);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background-color: var(--secondary-color);
        }

        /* ===== لوحة التحكم ===== */
        .admin-dashboard {
            display: none;
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 4%;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        @media (max-width: 992px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ===== استمارة الإدخال ===== */
        .form-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
            height: fit-content;
            position: sticky;
            top: 90px;
        }
        .form-card h3 {
            margin-bottom: 20px;
            font-weight: 700;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }
        html[dir="ltr"] .form-group {
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--secondary-color);
        }

        /* ===== منطقة رفع الصور (السحب والإفلات) ===== */
        .upload-area {
            border: 3px dashed var(--upload-border);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            background-color: var(--upload-bg);
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .upload-area.dragover {
            border-color: var(--secondary-color);
            background-color: rgba(231, 76, 60, 0.08);
            transform: scale(1.02);
        }
        .upload-area .upload-icon {
            font-size: 48px;
            color: var(--upload-border);
            transition: color 0.3s;
        }
        .upload-area:hover .upload-icon {
            color: var(--secondary-color);
        }
        .upload-area .upload-text {
            font-weight: 700;
            font-size: 16px;
            color: var(--text-color);
        }
        .upload-area .upload-hint {
            font-size: 13px;
            color: #7f8c8d;
        }
        .upload-area input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .upload-preview {
            margin-top: 12px;
            display: none;
            align-items: center;
            gap: 15px;
            padding: 10px;
            border-radius: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            flex-wrap: wrap;
        }
        .upload-preview img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid var(--border-color);
        }
        .upload-preview .file-info {
            flex: 1;
            font-size: 13px;
            overflow: hidden;
        }
        .upload-preview .file-info .file-name {
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .upload-preview .file-info .file-size {
            color: #7f8c8d;
            font-size: 12px;
        }
        .upload-preview .remove-file {
            color: #e74c3c;
            cursor: pointer;
            font-size: 18px;
            padding: 5px 10px;
            border-radius: 50%;
            transition: background 0.2s;
        }
        .upload-preview .remove-file:hover {
            background: rgba(231, 76, 60, 0.15);
        }

        .upload-progress {
            display: none;
            width: 100%;
            margin-top: 10px;
        }
        .upload-progress .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--border-color);
            border-radius: 10px;
            overflow: hidden;
        }
        .upload-progress .progress-bar .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--success-color);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        .upload-progress .progress-text {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
            text-align: center;
        }

        /* ===== حقل الرابط الاحتياطي ===== */
        .url-fallback-group {
            display: none;
            margin-top: 10px;
        }
        .url-fallback-group label {
            font-weight: 400;
            font-size: 13px;
            color: #e67e22;
        }
        .url-fallback-group input {
            direction: ltr;
            text-align: left;
        }

        /* ===== الأزرار ===== */
        .btn-container {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        .submit-btn {
            flex: 1;
            padding: 12px;
            background-color: var(--success-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .submit-btn:hover {
            background-color: #1ebd58;
        }
        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .cancel-btn {
            display: none;
            padding: 12px 20px;
            background-color: #7f8c8d;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .cancel-btn:hover {
            background-color: #5a6a6b;
        }

        /* ===== قائمة المنتجات ===== */
        .products-management {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.05);
        }
        .products-management h3 {
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .filter-select {
            padding: 8px 15px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            background-color: var(--input-bg);
            color: var(--text-color);
            font-size: 14px;
        }

        .admin-products-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-height: 700px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .admin-product-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--bg-color);
            transition: all 0.3s;
        }
        body.dark-theme .admin-product-item {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .admin-product-item img {
            width: 65px;
            height: 65px;
            object-fit: cover;
            border-radius: 8px;
        }

        .admin-product-details {
            flex: 1;
        }
        .admin-product-name {
            font-weight: 700;
            font-size: 16px;
        }
        .admin-product-cat {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 2px;
        }
        .admin-product-price {
            font-weight: 900;
            color: var(--secondary-color);
            margin-top: 4px;
            font-size: 15px;
        }

        .admin-actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            color: white;
            transition: transform 0.2s;
        }
        .action-btn:hover {
            transform: scale(1.1);
        }
        .edit-btn {
            background-color: #3498db;
        }
        .delete-btn {
            background-color: #e74c3c;
        }

        /* ===== حركات ===== */
        @keyframes pulseGlow {
            0% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(231, 76, 60, 0.4));
            }
            100% {
                transform: scale(1.08);
                filter: drop-shadow(0 0 20px rgba(231, 76, 60, 0.8));
            }
        }
        @keyframes loadingBar {
            0% {
                left: -50%;
            }
            100% {
                left: 100%;
            }
        }

        /* ===== التوافق مع الهواتف ===== */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 15px;
                padding: 15px 4%;
                text-align: center;
            }
            .logo {
                font-size: 17px;
                justify-content: center;
                flex-wrap: wrap;
                line-height: 1.4;
            }
            .header-controls {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                width: 100%;
            }
            .lang-toggle,
            .logout-btn {
                font-size: 12px;
                padding: 6px 12px;
            }

            .admin-dashboard {
                margin: 15px auto;
                padding: 0 3%;
            }
            .form-card {
                position: relative;
                top: 0;
                padding: 20px 15px;
            }

            .products-management {
                padding: 20px 15px;
            }
            .products-management h3 {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .filter-select {
                width: 100%;
            }
            .admin-product-item {
                flex-direction: column;
                text-align: center;
                gap: 10px;
                padding: 12px;
            }
            .admin-product-details {
                width: 100%;
            }
            .admin-product-name {
                font-size: 14px;
            }
            .admin-actions {
                width: 100%;
                justify-content: center;
                margin-top: 5px;
            }

            .login-container {
                width: 90%;
                padding: 30px 20px;
                margin: 40px auto;
            }
            .login-container h2 {
                font-size: 22px;
            }

            .upload-area {
                padding: 20px 15px;
                min-height: 120px;
            }
            .upload-area .upload-icon {
                font-size: 34px;
            }
            .upload-preview img {
                width: 50px;
                height: 50px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== شاشة البداية ===== -->
    <div class="splash-screen" id="splashScreen">
        <div class="splash-content">
            <i class="fa-solid fa-cloud splash-logo"></i>
            <h1 class="splash-title" id="splashTitle">مكتبة البيان</h1>
            <div class="splash-loader"></div>
        </div>
    </div>

    <!-- ===== الهيدر ===== -->
    <header>
        <div class="logo"><i class="fa-solid fa-cloud"></i> <span id="headerTitle">Cloud Art | لوحة التحكم وإدخال البيانات</span></div>
        <div class="header-controls">
            <div class="lang-toggle" id="langToggleBtn">
                <i class="fa-solid fa-language"></i>
                <span id="langText">English</span>
            </div>
            <div class="theme-toggle" id="themeToggleBtn">
                <i class="fa-solid fa-moon"></i>
            </div>
            <button class="logout-btn" id="logoutBtn" onclick="logoutAdmin()"><i class="fa-solid fa-right-from-bracket"></i> خروج</button>
        </div>
    </header>

    <!-- ===== تسجيل الدخول ===== -->
    <div class="login-container" id="loginBox">
        <h2 id="loginHeading">تسجيل دخول النظام</h2>
        <div class="input-group">
            <label id="lblUser">المستخدم وصلاحية النظام:</label>
            <select id="adminUser">
                <option value="Al-Rasheed Kamal">Al-Rasheed Kamal (Owner)</option>
                <option value="Othman Al-Tijani">Othman Al-Tijani (Cashier)</option>
                <option value="Mazan Naji">Mazan Naji (Cashier)</option>
            </select>
        </div>
        <div class="input-group">
            <label id="lblPass">كلمة المرور:</label>
            <input type="password" id="adminPass" placeholder="أدخل كلمة المرور (bayan2026)...">
        </div>
        <button class="login-btn" id="btnLogin" onclick="loginAdmin()">تسجيل الدخول</button>
    </div>

    <!-- ===== لوحة الإدارة ===== -->
    <main class="admin-dashboard" id="adminDashboard">
        <div class="dashboard-grid">

            <!-- ===== نموذج الإدخال ===== -->
            <section class="form-card">
                <h3 id="formHeading">إضافة منتج جديد</h3>
                <form id="productForm" onsubmit="handleFormSubmit(event)">

                    <div class="form-group">
                        <label id="lblFormCat">قسم المنتج:</label>
                        <select id="prodCategory" required>
                            <option value="قسم الكتب والمذكرات">قسم الكتب والمذكرات</option>
                            <option value="قسم تزيين العربات">قسم تزيين العربات</option>
                            <option value="قسم تطوير المواقع والتطبيقات">قسم تطوير المواقع والتطبيقات</option>
                            <option value="قسم الالعاب">قسم الالعاب</option>
                            <option value="قسم الهدايا">قسم الهدايا</option>
                            <option value="قسم الهدايا والانتيكات">قسم الهدايا والانتيكات</option>
                            <option value="قسم التصاميم الجرافيك">قسم التصاميم الجرافيك</option>
                            <option value="قسم الأدوات المكتبية">قسم الأدوات المكتبية</option>
                            <option value="قسم الطباعة والتصوير والتغليف">قسم الطباعة والتصوير والتغليف</option>
                            <option value="قسم الأدوات المدرسية">قسم الأدوات المدرسية</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label id="lblFormNameAr">اسم المنتج (بالعربية):</label>
                        <input type="text" id="prodNameAr" required placeholder="مثال: منظم مكتب فاخر" />
                    </div>

                    <div class="form-group">
                        <label id="lblFormNameEn">اسم المنتج (بالإنجليزية):</label>
                        <input type="text" id="prodNameEn" required placeholder="Example: Deluxe Desk Organizer" />
                    </div>

                    <div class="form-group">
                        <label id="lblFormPrice">سعر المنتج (ج.س):</label>
                        <input type="number" id="prodPrice" required placeholder="0" />
                    </div>

                    <!-- ===== رفع الصور ===== -->
                    <div class="form-group">
                        <label id="lblFormImg">صورة المنتج <span style="font-weight:400;font-size:13px;color:#7f8c8d;">(اسحب الصورة أو انقر للاختيار)</span></label>

                        <div class="upload-area" id="uploadArea">
                            <i class="fa-regular fa-image upload-icon"></i>
                            <div class="upload-text" id="uploadText">اسحب الصورة هنا أو انقر للاختيار</div>
                            <div class="upload-hint">يدعم JPG, PNG, WEBP, GIF</div>
                            <input type="file" id="fileInput" accept="image/*" />
                        </div>

                        <div class="upload-preview" id="uploadPreview">
                            <img id="previewImg" src="" alt="معاينة" />
                            <div class="file-info">
                                <div class="file-name" id="fileName">image.jpg</div>
                                <div class="file-size" id="fileSize">0 KB</div>
                            </div>
                            <span class="remove-file" id="removeFileBtn" title="إزالة الصورة"><i class="fa-solid fa-xmark"></i></span>
                        </div>

                        <div class="upload-progress" id="uploadProgress">
                            <div class="progress-bar">
                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                            <div class="progress-text" id="progressText">جاري الرفع ... 0%</div>
                        </div>

            globalProductsArray = [];
            snapshot.forEach((doc) => {

            });
            if (typeof window.loadAdminProducts === 'function') window.loadAdminProducts();

        // ===== عرض المنتجات =====
        window.loadAdminProducts = function() {
            const listContainer = document.getElementById('adminProductsList');
            listContainer.innerHTML = '';
            const selectedFilter = document.getElementById('filterCategory')?.value || 'كل الأقسام';

            let filteredProducts = globalProductsArray;
            if (selectedFilter !== 'كل الأقسام' && selectedFilter !== 'All Categories') {
                filteredProducts = globalProductsArray.filter(p => p.category === selectedFilter);
            }

            if (filteredProducts.length === 0) {
                listContainer.innerHTML =
                    `<div style="text-align:center; padding:20px; color:#7f8c8d;">${t('noProducts')}</div>`;
                return;
            }

            filteredProducts.forEach(product => {
                const displayName = currentLang === 'ar' ? product.nameAr : product.nameEn;
                const itemDiv = document.createElement('div');
                itemDiv.className = 'admin-product-item';
                itemDiv.innerHTML = `
                            <img src="${product.img}" alt="${displayName}" onerror="this.src='https://images.unsplash.com/photo-1594322436404-5a0526db4d13?w=100'">

                                <div class="admin-product-name">${displayName}</div>
                                <div class="admin-product-cat"><i class="fa-solid fa-folder-open"></i> ${product.category}</div>
                                <div class="admin-product-price">${Number(product.price).toLocaleString()} ${t('currency')}</div>
                            </div>
                            <div class="admin-actions">
                                <button class="action-btn edit-btn" title="${t('btnCancel')}" onclick="startEditProduct('${product.key}')"><i class="fa-solid fa-pen"></i></button>

                        `;
                listContainer.appendChild(itemDiv);
            });
        };

        // ================================================================
        // ===== رفع الصور عبر ImgBB (بديل Firebase Storage) =====

        const uploadArea = document.getElementById('uploadArea');

        const previewContainer = document.getElementById('uploadPreview');
        const previewImg = document.getElementById('previewImg');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const progressContainer = document.getElementById('uploadProgress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const removeFileBtn = document.getElementById('removeFileBtn');
        const prodImgInput = document.getElementById('prodImg');
        const prodImgFallback = document.getElementById('prodImgFallback');
        const urlFallbackGroup = document.getElementById('urlFallbackGroup');

        // ---- أحداث السحب والإفلات ----
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                handleFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFile(e.target.files[0]);
            }
        });

        // ---- معالجة الملف ورفعه إلى ImgBB ----
        function handleFile(file) {
            if (!file.type.startsWith('image/')) {
                alert(currentLang === 'ar' ? 'الرجاء اختيار ملف صورة فقط.' : 'Please select an image file.');
                return;
            }
            if (file.size > 5 * 1024 * 1024) {
                alert(currentLang === 'ar' ? 'حجم الصورة كبير جداً (الحد الأقصى 5 ميجابايت).' : 'Image size is too large (max 5MB).');
                return;
            }

            // معاينة
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewContainer.style.display = 'flex';
                fileName.textContent = file.name;
                fileSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
            };
            reader.readAsDataURL(file);

            // إخفاء الحقل الاحتياطي
            urlFallbackGroup.style.display = 'none';
            prodImgFallback.value = '';

            // رفع إلى ImgBB
            uploadToImgBB(file);
        }

        // ---- رفع الصورة إلى ImgBB ----
        async function uploadToImgBB(file) {
            if (isUploading) return;
            isUploading = true;

            const submitBtn = document.getElementById('btnSubmitForm');
            submitBtn.disabled = true;

            progressContainer.style.display = 'block';
            progressFill.style.width = '0%';
            progressText.textContent = `${t('uploading')} 0%`;

            try {
                // تحويل الملف إلى Base64
                const base64 = await fileToBase64(file);

                // إرسال إلى ImgBB
                const formData = new FormData();
                formData.append('key', IMGBB_API_KEY);
                formData.append('image', base64.split(',')[1]); // نرسل الجزء المشفر فقط
                formData.append('name', file.name);

                const response = await fetch('https://api.imgbb.com/1/upload', {
                    method: 'POST',
                    body: formData
                });

                // محاكاة التقدم (لأن ImgBB لا يوفر نسبة تقدم)
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    if (progress <= 90) {
                        progressFill.style.width = progress + '%';
                        progressText.textContent = `${t('uploading')} ${progress}%`;
                    }
                }, 200);

                const data = await response.json();
                clearInterval(interval);

                if (data.success) {
                    // نجاح الرفع
                    const imageUrl = data.data.url;
                    uploadedFileURL = imageUrl;
                    prodImgInput.value = imageUrl;
                    prodImgFallback.value = imageUrl;

                    progressFill.style.width = '100%';
                    progressText.textContent = `${t('uploadSuccess')} 100%`;
                    uploadArea.style.borderColor = 'var(--success-color)';
                    setTimeout(() => {
                        uploadArea.style.borderColor = 'var(--upload-border)';
                    }, 2000);

                    isUploading = false;
                    submitBtn.disabled = false;
                    urlFallbackGroup.style.display = 'none';

                    setTimeout(() => {
                        progressContainer.style.display = 'none';
                    }, 1500);
                } else {
                    throw new Error(data.error?.message || 'فشل الرفع');
                }

            } catch (error) {
                console.error('ImgBB upload error:', error);
                alert(t('uploadFail') + '\n' + (error.message || ''));
                isUploading = false;
                submitBtn.disabled = false;
                progressContainer.style.display = 'none';
                urlFallbackGroup.style.display = 'block';
                prodImgFallback.focus();
                uploadArea.style.borderColor = '#e67e22';
            }
        }

        // ---- تحويل الملف إلى Base64 ----
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = (error) => reject(error);
            });
        }

        // ---- إزالة الصورة ----
        removeFileBtn.addEventListener('click', () => {

            uploadArea.style.borderColor = 'var(--upload-border)';

        function resetUploadUI() {
            previewContainer.style.display = 'none';
            previewImg.src = '';

            fileSize.textContent = '';

        window.handleFormSubmit = async function(e) {
            e.preventDefault();

            // جلب الرابط من الحقل المخفي أو الاحتياطي
            let imgUrl = prodImgInput.value.trim();
            if (!imgUrl && prodImgFallback.value.trim()) {
                imgUrl = prodImgFallback.value.trim();
                prodImgInput.value = imgUrl;
            }

            if (!imgUrl) {
                alert(currentLang === 'ar' ? 'يرجى رفع صورة للمنتج أو إدخال رابط يدوي.' : 'Please upload an image or enter a manual URL.');
                return;
            }

            if (isUploading) {
                alert(currentLang === 'ar' ? 'الرجاء الانتظار حتى انتهاء رفع الصورة.' : 'Please wait for the image upload to finish.');
                return;
            }

            const category = document.getElementById('prodCategory').value;
            const nameAr = document.getElementById('prodNameAr').value.trim();
            const nameEn = document.getElementById('prodNameEn').value.trim();
            const price = parseFloat(document.getElementById('prodPrice').value);

            if (!nameAr || !nameEn || isNaN(price) || price < 0) {
                alert(currentLang === 'ar' ? 'يرجى تعبئة جميع الحقول بشكل صحيح.' : 'Please fill all fields correctly.');
                return;
            }

            const productData = {
                name: nameAr,
                nameAr: nameAr,
                nameEn: nameEn,
                price: price,
                img: imgUrl,
                category: category
            };

            try {
                if (editMode && currentEditKey) {
                    const docRef = doc(db, 'Products', currentEditKey);
                    await updateDoc(docRef, productData);
                    alert(t('updateSuccess'));
                    resetForm();
                } else {
                    await addDoc(productsCollection, productData);
                    alert(t('addSuccess'));
                    document.getElementById('productForm').reset();
                    resetUploadUI();
                    uploadedFileURL = '';
                    prodImgInput.value = '';
                    prodImgFallback.value = '';
                    urlFallbackGroup.style.display = 'none';
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        };

        // ===== بدء التعديل =====
        window.startEditProduct = function(key) {
            const product = globalProductsArray.find(p => p.key === key);
            if (!product) return;

            isUploading = false;
            document.getElementById('btnSubmitForm').disabled = false;

            editMode = true;
            currentEditKey = key;

            document.getElementById('prodCategory').value = product.category;
            document.getElementById('prodNameAr').value = product.nameAr || product.name || '';
            document.getElementById('prodNameEn').value = product.nameEn || '';
            document.getElementById('prodPrice').value = product.price;

            const imgUrl = product.img || '';
            prodImgInput.value = imgUrl;
            prodImgFallback.value = imgUrl;
            uploadedFileURL = imgUrl;

            if (imgUrl) {
                previewImg.src = imgUrl;
                previewContainer.style.display = 'flex';
                fileName.textContent = product.nameAr || product.name || 'صورة';
                fileSize.textContent = '';
                urlFallbackGroup.style.display = 'none';
            } else {
                resetUploadUI();
            }

            document.getElementById('btnCancelEdit').style.display = 'block';

            const dict = localizationDict[currentLang];
            document.getElementById('formHeading').innerText = dict.formHeadingEdit;
            document.getElementById('btnSubmitForm').innerText = dict.btnUpdateForm;
            document.getElementById('btnSubmitForm').style.backgroundColor = '#3498db';

            window.scrollTo({ top: document.querySelector('.form-card').offsetTop - 100, behavior: 'smooth' });
        };

        // ===== حذف المنتج =====
        window.deleteProduct = async function(key) {
            if (!confirm(t('confirmDelete'))) return;
            try {
                const docRef = doc(db, 'Products', key);
                await deleteDoc(docRef);
                alert(t('deleteSuccess'));
                if (editMode && currentEditKey === key) resetForm();
            } catch (err) {
                alert('Error: ' + err.message);
            }
        };

        // ===== إعادة تعيين النموذج =====
        window.resetForm = function() {
            editMode = false;
            currentEditKey = null;
            document.getElementById('productForm').reset();
            document.getElementById('btnCancelEdit').style.display = 'none';
            document.getElementById('btnSubmitForm').style.backgroundColor = 'var(--success-color)';

            resetUploadUI();
            uploadedFileURL = '';
            prodImgInput.value = '';
            prodImgFallback.value = '';
            urlFallbackGroup.style.display = 'none';
            isUploading = false;
            document.getElementById('btnSubmitForm').disabled = false;

            const dict = localizationDict[currentLang];
            document.getElementById('formHeading').innerText = dict.formHeading;
            document.getElementById('btnSubmitForm').innerText = dict.btnSubmitForm;
        };

        // ===== تهيئة التطبيق =====
        window.addEventListener('DOMContentLoaded', () => {
            checkSession();
            window.applyLanguage(currentLang);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && editMode) resetForm();
            });
        });

        // تصدير الدوال للنطاق العام
        window.t = t;
        window.resetUploadUI = resetUploadUI;
        window.handleFile = handleFile;
        window.uploadToImgBB = uploadToImgBB;

        console.log('✅ Cloud Art Admin جاهز مع رفع الصور عبر ImgBB (بديل Firebase Storage)');
        console.log('📸 اسحب الصورة إلى المنطقة المخصصة وسيتم رفعها تلقائياً إلى ImgBB.');
        console.log('🔑 مفتاح ImgBB المستخدم:', IMGBB_API_KEY);
    </script>

</body>
</html>
